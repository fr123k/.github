version: 1.0.0

approve:
  approver: fr123k
  include:
    branches:
      dependabot_golang:
        prefix: "dependabot/go_modules"
      dependabot_npm:
        prefix: "dependabot/npm_and_yarn"
      dependabot_gha:
        prefix: "dependabot/github_actions"

merge:
  include:
    branches:
      dependabot_golang:
        age: 2 days
        prefix: "dependabot/go_modules"
      dependabot_npm:
        age: 2 days
        prefix: "dependabot/npm_and_yarn"
      dependabot_gha:
        prefix: "dependabot/github_actions"
  method: squash
